apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: raw-journal-to-bronze-{{ (dag_run.logical_date or dag_run.run_after).strftime('%Y%m%dt%H%M%S') }}
  namespace: {{ params.namespace }}
spec:
  type: Python
  mode: cluster
  sparkVersion: "4.1.0"
  image: {{ params.image }}
  imagePullPolicy: {{ params.image_pull_policy }}
  imagePullSecrets:
    - ghcr-pull
  mainApplicationFile: local:///opt/spark/app/raw_to_bronze_etl_iceberg.py
  arguments:
    - --warehouse
    - {{ params.raw_warehouse }}
    - --bronze-warehouse
    - {{ params.bronze_warehouse }}
    - --lakekeeper-uri
    - {{ params.lakekeeper_uri }}
    - --oauth-uri
    - {{ params.lakekeeper_oauth_uri }}
    - --scope
    - {{ params.lakekeeper_scope }}
    - --app-name
    - raw-journal-to-bronze-{{ params.rebuild_all | lower }}
{% if params.rebuild_all %}
    - --rebuild-all
{% endif %}
  sparkConf:
    spark.driver.extraClassPath: "/opt/spark/iceberg-jars/*"
    spark.executor.extraClassPath: "/opt/spark/iceberg-jars/*"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.sql.shuffle.partitions: "{{ params.shuffle_partitions }}"
    spark.default.parallelism: "{{ params.shuffle_partitions }}"
    spark.sql.adaptive.enabled: "true"
    spark.redaction.regex: "(?i)secret|password|token|credential|access[.]?key"
    spark.kubernetes.driver.memoryOverhead: "{{ params.driver_memory_overhead }}"
    spark.kubernetes.executor.memoryOverhead: "{{ params.executor_memory_overhead }}"
    spark.hadoop.fs.s3a.endpoint: "{{ params.minio_endpoint }}"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "{{ params.minio_ssl_enabled }}"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
  restartPolicy:
    type: Never
  driver:
    cores: {{ params.driver_cores }}
    coreRequest: "{{ params.driver_core_request }}"
    memory: "{{ params.driver_memory }}"
    memoryOverhead: "{{ params.driver_memory_overhead }}"
    serviceAccount: {{ params.service_account }}
    nodeSelector:
      kubernetes.io/hostname: {{ params.driver_node_selector }}
    env: &commonEnv
      - name: PGHOST
        value: "{{ params.pg_host }}"
      - name: PGPORT
        value: "{{ params.pg_port }}"
      - name: PGDATABASE
        value: "{{ params.pg_database }}"
      - name: PGUSER
        valueFrom:
          secretKeyRef:
            name: pguser
            key: pguser
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: pgpass
            key: pgpass
      - name: MINIO_S3_ENDPOINT
        value: "{{ params.minio_endpoint }}"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_SECRET_KEY
      - name: LAKEKEEPER_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: lakekeeper-spark-client
            key: client-id
      - name: LAKEKEEPER_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: lakekeeper-spark-client
            key: client-secret
  executor:
    instances: {{ params.executor_instances }}
    cores: {{ params.executor_cores }}
    coreRequest: "{{ params.executor_core_request }}"
    memory: "{{ params.executor_memory }}"
    memoryOverhead: "{{ params.executor_memory_overhead }}"
    nodeSelector:
      kubernetes.io/hostname: {{ params.executor_node_selector }}
    env: *commonEnv
