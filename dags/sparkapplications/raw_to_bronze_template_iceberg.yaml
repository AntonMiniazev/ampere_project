apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: raw-to-iceberg-{{ params.stream }}-{{ (dag_run.logical_date or dag_run.run_after).strftime('%Y%m%dt%H%M%S') }}
  namespace: {{ params.namespace }}
spec:
  type: Python
  mode: cluster
  sparkVersion: "4.1.0"
  image: {{ params.image }}
  imagePullPolicy: {{ params.image_pull_policy }}
  imagePullSecrets:
    - ghcr-pull
  mainApplicationFile: local:///opt/spark/app/raw_to_bronze_etl_iceberg.py
  arguments:
    - --groups-config
    - '{{ params.groups_config | tojson }}'
    - --schema
    - {{ params.schema }}
    - --run-date
    - "{{ (dag_run.logical_date or dag_run.run_after).strftime('%Y-%m-%d') }}"
    - --raw-bucket
    - {{ params.raw_bucket }}
    - --raw-prefix
    - {{ params.raw_prefix }}
    - --source-system
    - {{ params.source_system }}
    - --iceberg-catalog
    - iceberg_bronze
    - --iceberg-bronze-schema
    - bronze
    - --iceberg-ops-schema
    - ops
    - --lakekeeper-warehouse
    - {{ params.lakekeeper_warehouse }}
    - --lakekeeper-uri
    - {{ params.lakekeeper_uri }}
    - --lakekeeper-oauth-uri
    - {{ params.lakekeeper_oauth_uri }}
    - --lakekeeper-scope
    - {{ params.lakekeeper_scope }}
    - --app-name
    - {{ params.app_name }}
{% if params.rebuild_all %}
    - --rebuild-all
{% endif %}
  sparkConf:
    spark.driver.extraClassPath: "/opt/spark/iceberg-jars/*"
    spark.executor.extraClassPath: "/opt/spark/iceberg-jars/*"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.sql.shuffle.partitions: "{{ params.shuffle_partitions }}"
    spark.default.parallelism: "{{ params.shuffle_partitions }}"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.redaction.regex: "(?i)secret|password|token|credential|access[.]?key"
    spark.kubernetes.driver.memoryOverhead: "{{ params.driver_memory_overhead }}"
    spark.kubernetes.executor.memoryOverhead: "{{ params.executor_memory_overhead }}"
    spark.hadoop.fs.s3a.endpoint: "{{ params.minio_endpoint }}"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "{{ params.minio_ssl_enabled }}"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    spark.hadoop.fs.s3.endpoint: "{{ params.minio_endpoint }}"
    spark.hadoop.fs.s3.path.style.access: "true"
    spark.hadoop.fs.s3.connection.ssl.enabled: "{{ params.minio_ssl_enabled }}"
    spark.hadoop.fs.s3.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.AbstractFileSystem.s3.impl: "org.apache.hadoop.fs.s3a.S3A"
  restartPolicy:
    type: Never
  driver:
    cores: {{ params.driver_cores }}
    coreRequest: "{{ params.driver_core_request }}"
    memory: "{{ params.driver_memory }}"
    serviceAccount: {{ params.service_account }}
    nodeSelector:
      kubernetes.io/hostname: {{ params.driver_node_selector }}
    env:
      - name: MINIO_S3_ENDPOINT
        value: "{{ params.minio_endpoint }}"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_SECRET_KEY
      - name: LAKEKEEPER_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: lakekeeper-spark-client
            key: client-id
      - name: LAKEKEEPER_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: lakekeeper-spark-client
            key: client-secret
  executor:
    instances: {{ params.executor_instances }}
    cores: {{ params.executor_cores }}
    coreRequest: "{{ params.executor_core_request }}"
    memory: "{{ params.executor_memory }}"
{% if params.get('executor_node_selector') %}
    nodeSelector:
      kubernetes.io/hostname: {{ params.executor_node_selector }}
{% endif %}
    env:
      - name: MINIO_S3_ENDPOINT
        value: "{{ params.minio_endpoint }}"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_SECRET_KEY
