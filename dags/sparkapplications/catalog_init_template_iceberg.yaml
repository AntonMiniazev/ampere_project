apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: ampere-iceberg-catalog-init-{{ (dag_run.logical_date or dag_run.run_after).strftime('%Y%m%dt%H%M%S') }}
  namespace: {{ params.namespace }}
spec:
  type: Python
  mode: cluster
  sparkVersion: "4.1.0"
  image: {{ params.image }}
  imagePullPolicy: Always
  imagePullSecrets:
    - ghcr-pull
  mainApplicationFile: local:///opt/spark/app/initialize_iceberg_catalog.py
  sparkConf:
    spark.driver.extraClassPath: "/opt/spark/iceberg-jars/*"
    spark.executor.extraClassPath: "/opt/spark/iceberg-jars/*"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.redaction.regex: "(?i)secret|password|token|credential|access[.]?key"
    spark.hadoop.fs.s3a.endpoint: "{{ params.minio_endpoint }}"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "{{ params.minio_ssl_enabled }}"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
  restartPolicy:
    type: Never
  driver:
    cores: {{ params.driver_cores }}
    coreRequest: "{{ params.driver_core_request }}"
    memory: "{{ params.driver_memory }}"
    serviceAccount: {{ params.service_account }}
    nodeSelector:
      kubernetes.io/hostname: {{ params.driver_node_selector }}
    env:
      - name: MINIO_S3_ENDPOINT
        value: "{{ params.minio_endpoint }}"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_SECRET_KEY
      - name: LAKEKEEPER_CATALOG_URI
        value: "{{ params.lakekeeper_uri }}"
      - name: LAKEKEEPER_OAUTH_URI
        value: "{{ params.lakekeeper_oauth_uri }}"
      - name: LAKEKEEPER_SCOPE
        value: "{{ params.lakekeeper_scope }}"
      - name: LAKEKEEPER_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: lakekeeper-spark-client
            key: client-id
      - name: LAKEKEEPER_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: lakekeeper-spark-client
            key: client-secret
      - name: ICEBERG_BRONZE_WAREHOUSE
        value: "{{ params.bronze_warehouse }}"
      - name: ICEBERG_SILVER_WAREHOUSE
        value: "{{ params.silver_warehouse }}"
      - name: ICEBERG_GOLD_WAREHOUSE
        value: "{{ params.gold_warehouse }}"
  executor:
    instances: 1
    cores: 1
    coreRequest: "250m"
    memory: "1g"
    env:
      - name: MINIO_S3_ENDPOINT
        value: "{{ params.minio_endpoint }}"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_ACCESS_KEY
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-creds
            key: MINIO_SECRET_KEY
