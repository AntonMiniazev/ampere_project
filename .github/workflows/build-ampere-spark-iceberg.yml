name: Build ampere-spark-iceberg image

on:
  workflow_dispatch:
  push:
    branches: [migration/iceberg, main]
    paths:
      - docker/spark/iceberg_raw_etl/**
      - tools/contracts/**
      - tests/test_iceberg_bronze_contract.py
      - tests/test_iceberg_bronze_spark.py
      - tests/test_iceberg_mutable_dedup.py
      - tests/test_iceberg_housekeeping.py
      - tests/test_iceberg_catalog_init.py
      - .github/workflows/build-ampere-spark-iceberg.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/antonminiazev/ampere-spark-iceberg
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=migration-latest,enable=${{ github.ref == 'refs/heads/migration/iceberg' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark/iceberg_raw_etl/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
