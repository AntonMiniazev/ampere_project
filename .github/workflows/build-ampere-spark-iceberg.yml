name: Build ampere-spark-iceberg image

on:
  workflow_dispatch:
  push:
    branches: [migration/iceberg, main]
    paths:
      - docker/spark/iceberg_raw_etl/**
      - tools/contracts/**
      - tests/test_iceberg_bronze_contract.py
      - tests/test_iceberg_bronze_spark.py
      - tests/test_iceberg_mutable_dedup.py
      - tests/test_iceberg_housekeeping.py
      - dags/sparkapplications/catalog_init_template_iceberg.yaml
      - .github/workflows/build-ampere-spark-iceberg.yml

permissions:
  contents: read
  packages: write

jobs:
  spark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Spark and Iceberg runtime
        run: |
          python -m pip install 'pyspark[connect]==4.1.0'
          python -c "import grpc; from pyspark.sql.connect.session import SparkSession; print('Spark Connect dependencies available')"
          curl -fsSL 'https://repo.maven.apache.org/maven2/org/apache/iceberg/iceberg-spark-runtime-4.1_2.13/1.12.0/iceberg-spark-runtime-4.1_2.13-1.12.0.jar' -o iceberg-runtime.jar
      - name: Check contract and Iceberg writes
        env:
          ICEBERG_RUNTIME_JAR: ${{ github.workspace }}/iceberg-runtime.jar
        run: |
          python tools/contracts/ampere_contract.py
          python -m unittest discover -s tests -p 'test_iceberg_bronze*.py' -v
          python -m unittest discover -s tests -p 'test_iceberg_mutable_dedup.py' -v
          python -m unittest discover -s tests -p 'test_iceberg_housekeeping.py' -v

  build-and-push:
    needs: spark-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/antonminiazev/ampere-spark-iceberg
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=migration-latest,enable=${{ github.ref == 'refs/heads/migration/iceberg' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark/iceberg_raw_etl/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
