name: Build ampere-dbt-iceberg image

on:
  workflow_dispatch:
  push:
    branches: [migration/iceberg]
    paths:
      - dbt_iceberg/**
      - docker/dbt_iceberg/**
      - tools/budget_generation/budget_parameters_daily.csv
      - .github/workflows/build-ampere-dbt-iceberg.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/antonminiazev/ampere-dbt-iceberg
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=migration-latest,enable=${{ github.ref == 'refs/heads/migration/iceberg' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dbt_iceberg/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
