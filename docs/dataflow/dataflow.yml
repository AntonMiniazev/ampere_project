project: ampere

layers:
  source:
    title: Python generator + PostgreSQL
    status: implemented
    responsibility: Generate current operational data in PostgreSQL and capture exact mutation-time event images as bounded immutable Parquet batches in MinIO.
    diagram_note: PostgreSQL owns current state and compact batch controls; MinIO holds typed, replayable event files and commit manifests.
    engine: [Python, PostgreSQL]
    storage: [PostgreSQL]

  raw:
    title: Raw Iceberg change history
    status: implemented
    responsibility: Validate committed PostgreSQL batch controls and MinIO Parquet manifests, then merge typed event rows into Raw Iceberg with durable per-table acknowledgments.
    diagram_note: Typed event files and commit markers, ordered by dataset batch and change sequence.
    engine: [Spark]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: raw warehouse / raw namespace
    controls: [PostgreSQL dataset and batch registry, PostgreSQL Raw transfer registry, MinIO manifests and commit markers]

  bronze:
    title: Bronze
    status: implemented
    responsibility: Maintain current state from accepted Raw changes; daily apply resumes one frozen transfer across two sequential Spark groups, using versioned merges, while full rebuild publishes each reconstructed table in one atomic overwrite commit.
    diagram_note: Resume the accepted transfer across both application groups, reduce changes in source order, apply stable-key inserts and updates, and delete source rows without stale replay.
    engine: [Spark, Iceberg]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: bronze warehouse / bronze and ops namespaces

  silver:
    title: Silver
    status: implemented
    responsibility: Use Raw batch metadata to rebuild complete records for affected orders, validate them with dbt, and publish reusable Iceberg tables after the last successful sequence checkpoint.
    diagram_note: Preserve full history while applying only changed orders; unchanged replays skip Iceberg updates.
    engine: [DuckDB, dbt, Iceberg]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: silver warehouse / silver namespace

  gold:
    title: Gold
    status: implemented
    responsibility: Recompute complete affected-month slices for eight Curie report aggregates and retain full-history rebuild mode.
    diagram_note: Replace only months recorded by successful Silver publications and preserve untouched months.
    engine: [DuckDB, dbt, Iceberg]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: gold warehouse / gold namespace

  serving:
    title: Serving / BI
    status: implemented
    responsibility: Refresh Curie caches from Gold marts for application and dashboard reads.
    diagram_note: Curie refreshes its Iceberg cache after a successful Gold publish.
    engine: [Curie]
    storage: [Cache]

flows:
  - from: source
    to: raw
    engine: Spark
    artifact: Accepted Raw Iceberg change history
    description: Validate completed source batches and immutable typed Parquet manifests, then idempotently merge staged rows into Raw Iceberg.

  - from: raw
    to: bronze
    engine: Spark + Iceberg
    artifact: Bronze Iceberg tables
    description: Apply the next complete Raw transfer, or reduce retained history once for a controlled full rebuild.

  - from: bronze
    to: silver
    engine: DuckDB + dbt
    artifact: Silver Iceberg tables
    description: Select affected order IDs from immutable Raw changes since the successful Silver sequence checkpoint, rebuild their complete records and events, then advance the checkpoint only after publication.

  - from: silver
    to: gold
    engine: DuckDB + dbt
    artifact: Eight domain-specific Gold aggregates
    description: Rebuild complete months listed by successful Silver publications, synchronize only those month keys, and preserve untouched history.

  - from: gold
    to: serving
    engine: Curie cache refresh
    artifact: Serving cache
    description: Refresh Curie after a successful Gold publish.
