project: ampere

layers:
  source:
    title: Python generator + PostgreSQL
    status: implemented
    responsibility: Generate synthetic operational data in PostgreSQL.
    diagram_note: Synthetic transactions and mutable source rows.
    engine: [Python, PostgreSQL]
    storage: [PostgreSQL]

  raw:
    title: Raw landing
    status: implemented
    responsibility: Extract immutable Parquet batches with manifests, success markers, and extraction state.
    diagram_note: Immutable Parquet batches with manifest, success marker, and extract state.
    engine: [Spark]
    storage: [MinIO, Parquet]
    controls: [_manifest.json, _SUCCESS, _state_<table>.json]

  bronze:
    title: Bronze
    status: implemented
    responsibility: Apply Raw batches to Iceberg tables and track processed batches in an Iceberg registry.
    diagram_note: Replace snapshot partitions, merge mutable dimensions and events, and append or merge facts.
    engine: [Spark, Iceberg]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: bronze warehouse / bronze and ops namespaces

  silver:
    title: Silver
    status: implemented
    responsibility: Build tested analytical entities from Bronze with dbt and DuckDB.
    diagram_note: Clean types, join entities, test relationships, and publish reusable Iceberg tables.
    engine: [DuckDB, dbt, Iceberg]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: silver warehouse / silver namespace

  gold:
    title: Gold
    status: implemented
    responsibility: Publish serving marts for sales, delivery, product cost, and margin.
    diagram_note: Publish BI marts from Silver with keyed updates and complete dimension synchronization.
    engine: [DuckDB, dbt, Iceberg]
    storage: [MinIO, Iceberg]
    catalog: Lakekeeper
    catalog_schema: gold warehouse / gold namespace

  serving:
    title: Serving / BI
    status: implemented
    responsibility: Refresh Curie caches from Gold marts for application and dashboard reads.
    diagram_note: Curie refreshes its Iceberg cache after a successful Gold publish.
    engine: [Curie]
    storage: [Cache]

flows:
  - from: source
    to: raw
    engine: Spark
    artifact: Raw Parquet batches
    description: Extract PostgreSQL source tables into validated Raw batches.

  - from: raw
    to: bronze
    engine: Spark + Iceberg
    artifact: Bronze Iceberg tables
    description: Apply complete Raw batches through the Lakekeeper catalog.

  - from: bronze
    to: silver
    engine: DuckDB + dbt
    artifact: Silver Iceberg tables
    description: Build and publish reusable analytical entities.

  - from: silver
    to: gold
    engine: DuckDB + dbt
    artifact: Gold Iceberg marts
    description: Build and publish serving marts from the Silver slice.

  - from: gold
    to: serving
    engine: Curie cache refresh
    artifact: Serving cache
    description: Refresh Curie after a successful Gold publish.
